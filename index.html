<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despesas da família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#EDF1F2; --tinta:#13252C; --suave:#5B6E75; --linha:#D3DCDF;
  --card:#fff; --verde:#0D6B63; --noite:#0F2A30; --ouro:#F0B429; --perigo:#B3382C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.topo{background:var(--noite);color:#fff;padding:20px max(20px,calc((100% - 1040px)/2)) 28px}
.topo-linha{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:1.2rem;font-weight:600;margin:0}
.mes{font-size:.9rem;display:flex;align-items:center;gap:8px}
.mes input{background:#1B3F47;color:#fff;border:1px solid #2C5560;border-radius:8px;padding:6px 10px;font:inherit}
.total{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800;letter-spacing:-.02em;color:var(--ouro);margin:18px 0 0;line-height:1}
.total-sub{margin:6px 0 0;color:#A9C2C7;font-size:.95rem}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px max(20px,calc((100% - 1040px)/2))}
.card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:20px}
.larga{grid-column:1/-1}
h2{font-size:1.05rem;margin:0 0 14px;font-weight:600}
h2.sp{margin-top:26px}
form{display:grid;gap:12px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--suave)}
input,select{font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linha);border-radius:8px;padding:9px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ouro);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 14px;border:1px solid transparent}
.primario{background:var(--verde);color:#fff;font-weight:600}
.primario:hover{background:#0A5852}
.fantasma{background:transparent;border-color:var(--linha);color:var(--tinta)}
.fantasma:hover{background:var(--fundo)}
.barra-linha{margin-bottom:12px}
.barra-info{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.barra-info span:last-child{font-variant-numeric:tabular-nums}
.trilho{height:8px;background:var(--fundo);border-radius:99px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .35s ease}
.lista-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.lista-topo h2{margin:0}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{text-align:left;font-weight:600;color:var(--suave);font-size:.82rem;padding:8px 10px;border-bottom:1px solid var(--linha)}
td{padding:10px;border-bottom:1px solid var(--fundo)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.excluir{background:transparent;color:var(--perigo);border-color:transparent;padding:4px 8px}
.excluir:hover{border-color:var(--perigo)}
.vazio{color:var(--suave);margin:8px 0}
footer{text-align:center;color:var(--suave);font-size:.82rem;padding:4px 20px 28px}
@media(max-width:760px){main{grid-template-columns:1fr}.larga{grid-column:auto}}
@media(prefers-reduced-motion:reduce){.trilho i{transition:none}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-linha">
    <h1>Despesas da família</h1>
    <label class="mes">Mês <input type="month" id="mes"></label>
  </div>
  <p class="total" id="total">R$ 0,00</p>
  <p class="total-sub" id="total-sub">gastos no mês</p>
</header>

<main>
  <section class="card" aria-labelledby="t-novo">
    <h2 id="t-novo">Nova despesa</h2>
    <form id="form">
      <label>Descrição <input id="descricao" maxlength="200" required placeholder="Ex.: Compras da semana"></label>
      <div class="duas">
        <label>Valor (R$) <input id="valor" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
        <label>Data <input id="data" type="date" required></label>
      </div>
      <div class="duas">
        <label>Categoria <select id="categoria"></select></label>
        <label>Quem gastou <input id="pessoa" list="pessoas-lista" maxlength="60" required placeholder="Ex.: Ygor"></label>
      </div>
      <datalist id="pessoas-lista"></datalist>
      <button type="submit" class="primario">Salvar despesa</button>
    </form>
  </section>

  <section class="card" aria-labelledby="t-resumo">
    <h2 id="t-resumo">Por categoria</h2>
    <div id="cats"></div>
    <h2 class="sp">Por pessoa</h2>
    <div id="pessoas"></div>
  </section>

  <section class="card larga" aria-labelledby="t-lista">
    <div class="lista-topo">
      <h2 id="t-lista">Lançamentos do mês</h2>
      <button type="button" id="csv" class="fantasma">Exportar CSV</button>
    </div>
    <div id="lista"></div>
  </section>
</main>
<footer id="modo"></footer>
<script>
const CATEGORIAS = ["Moradia", "Mercado", "Transporte", "Saúde", "Educação", "Lazer", "Contas", "Outros"];
const $ = (s) => document.querySelector(s);
const brl = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const hoje = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

// Armazenamento: usa o servidor Python (SQLite) se estiver rodando;
// se o HTML for aberto direto no Chrome, guarda no próprio navegador (localStorage).
const Store = {
  modo: "local",
  async carregar() {
    try {
      const r = await fetch("/api/despesas");
      if (!r.ok) throw new Error();
      const dados = await r.json();
      this.modo = "api";
      return dados;
    } catch {
      this.modo = "local";
      try { return JSON.parse(localStorage.getItem("despesas") || "[]"); } catch { return []; }
    }
  },
  async adicionar(d, lista) {
    if (this.modo === "api") {
      const r = await fetch("/api/despesas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
      if (!r.ok) throw new Error("Falha ao salvar");
      return await r.json();
    }
    const nova = { ...d, id: Date.now() };
    localStorage.setItem("despesas", JSON.stringify([...lista, nova]));
    return nova;
  },
  async remover(id, lista) {
    if (this.modo === "api") {
      const r = await fetch("/api/despesas/" + id, { method: "DELETE" });
      if (!r.ok) throw new Error("Falha ao excluir");
      return;
    }
    localStorage.setItem("despesas", JSON.stringify(lista.filter((x) => x.id !== id)));
  },
};

let itens = [];

const doMes = () => itens.filter((i) => i.data.startsWith($("#mes").value))
  .sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);

function agrupar(lista, chave) {
  const m = {};
  lista.forEach((i) => { m[i[chave]] = (m[i[chave]] || 0) + i.valor; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}

function barras(alvo, grupos, total) {
  alvo.replaceChildren();
  if (!grupos.length) { alvo.append(el("p", "vazio", "Sem dados neste mês.")); return; }
  grupos.forEach(([nome, valor]) => {
    const pct = total ? (valor / total) * 100 : 0;
    const linha = el("div", "barra-linha");
    const info = el("div", "barra-info");
    info.append(el("span", "", nome), el("span", "", brl(valor) + " · " + pct.toFixed(0) + "%"));
    const trilho = el("div", "trilho");
    const fill = document.createElement("i");
    fill.style.width = pct + "%";
    trilho.append(fill);
    linha.append(info, trilho);
    alvo.append(linha);
  });
}

function renderLista(lista) {
  const alvo = $("#lista");
  alvo.replaceChildren();
  if (!lista.length) { alvo.append(el("p", "vazio", "Nenhuma despesa neste mês. Adicione a primeira no formulário.")); return; }
  const wrap = el("div", "rolagem");
  const t = el("table");
  const cab = el("tr");
  [["Data", ""], ["Descrição", ""], ["Categoria", ""], ["Quem", ""], ["Valor", "num"], ["", ""]].forEach(([n, c]) => cab.append(el("th", c, n)));
  const thead = el("thead"); thead.append(cab);
  const tbody = el("tbody");
  lista.forEach((i) => {
    const tr = el("tr");
    const [y, m, d] = i.data.split("-");
    tr.append(el("td", "", d + "/" + m + "/" + y), el("td", "", i.descricao), el("td", "", i.categoria), el("td", "", i.pessoa), el("td", "num", brl(i.valor)));
    const td = el("td");
    const b = el("button", "excluir", "Excluir");
    b.type = "button";
    b.setAttribute("aria-label", "Excluir " + i.descricao);
    b.addEventListener("click", async () => {
      if (!confirm("Excluir \"" + i.descricao + "\"?")) return;
      try { await Store.remover(i.id, itens); itens = itens.filter((x) => x.id !== i.id); render(); }
      catch { alert("Não foi possível excluir. Tente novamente."); }
    });
    td.append(b); tr.append(td); tbody.append(tr);
  });
  t.append(thead, tbody); wrap.append(t); alvo.append(wrap);
}

function render() {
  const lista = doMes();
  const total = lista.reduce((s, i) => s + i.valor, 0);
  $("#total").textContent = brl(total);
  $("#total-sub").textContent = lista.length === 1 ? "1 lançamento no mês" : lista.length + " lançamentos no mês";
  barras($("#cats"), agrupar(lista, "categoria"), total);
  barras($("#pessoas"), agrupar(lista, "pessoa"), total);
  renderLista(lista);
  $("#pessoas-lista").replaceChildren(...[...new Set(itens.map((i) => i.pessoa))].map((p) => { const o = document.createElement("option"); o.value = p; return o; }));
  $("#modo").textContent = Store.modo === "api"
    ? "Salvando no banco de dados local (SQLite)."
    : "Salvando neste navegador. Os dados ficam só neste computador.";
}

function exportarCSV() {
  const lista = doMes();
  const esc = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const linhas = [["Data", "Descrição", "Categoria", "Quem", "Valor"].join(";")];
  lista.forEach((i) => linhas.push([i.data, esc(i.descricao), i.categoria, esc(i.pessoa), String(i.valor).replace(".", ",")].join(";")));
  const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "despesas-" + $("#mes").value + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function iniciar() {
  $("#mes").value = hoje().slice(0, 7);
  $("#data").value = hoje();
  CATEGORIAS.forEach((c) => { const o = document.createElement("option"); o.textContent = c; $("#categoria").append(o); });
  itens = await Store.carregar();
  render();

  $("#mes").addEventListener("change", render);
  $("#csv").addEventListener("click", exportarCSV);
  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = {
      descricao: $("#descricao").value.trim(),
      valor: Math.round(parseFloat($("#valor").value) * 100) / 100,
      data: $("#data").value,
      categoria: $("#categoria").value,
      pessoa: $("#pessoa").value.trim(),
    };
    if (!d.descricao || !d.pessoa || !(d.valor > 0)) return;
    try {
      const nova = await Store.adicionar(d, itens);
      itens.push(nova);
      $("#mes").value = d.data.slice(0, 7);
      $("#descricao").value = ""; $("#valor").value = "";
      render();
      $("#descricao").focus();
    } catch { alert("Não foi possível salvar. Tente novamente."); }
  });
}
iniciar();
</script>
</body>
</html>
